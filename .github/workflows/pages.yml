name: Deploy to GitHub Pages

# Pages cannot be switched on through the API from outside Actions, so the
# first run of this workflow turns it on itself (configure-pages
# enablement) and every run after that just publishes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a live publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Renders src/ into _site/ and copies the assets alongside. Publishes
      # the site only — not the sources, the tools or this workflow.
      - name: Build site
        run: python3 tools/build.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
