name: Deploy to GitHub Pages

# Pages cannot be switched on through the API from outside Actions, so the
# first run of this workflow turns it on itself (configure-pages
# enablement) and every run after that just publishes.
#
# Note this workflow is only half the story: a repository whose Pages
# source is the branch root serves the committed pages at the repo root
# instead of anything uploaded here. Both paths are kept working on
# purpose — see tools/build.py.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a live publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The pages committed at the repo root are what a branch-root Pages build
  # serves, so they must not drift from src/. Rebuild and diff.
  check-committed-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild in place and fail on drift
        run: |
          python3 tools/build.py . --in-place
          if ! git diff --quiet -- '*.html'; then
            echo "::error::Committed pages are stale. Run: python3 tools/build.py . --in-place"
            git diff --stat -- '*.html'
            exit 1
          fi
          echo "Committed pages match src/."

  deploy:
    runs-on: ubuntu-latest
    needs: check-committed-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Renders src/ into _site/ and copies the assets alongside. Publishes
      # the site only — not the sources, the tools or this workflow.
      - name: Build site
        run: python3 tools/build.py _site

      # The downloadable menu PDFs are committed (see tools/build-menu-pdfs.js)
      # rather than generated here, so this job needs no browser.
      - name: Copy menu PDFs
        run: cp -r menus _site/menus

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
